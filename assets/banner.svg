<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite reverse;
      transform-origin: 1000px 320px;
    }
    .card-float-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: beamFlow 12s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .body-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Deep Background) -->
  <circle class="orb-1" cx="220" cy="120" r="180" fill="#4f46e5" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="980" cy="300" r="200" fill="#06b6d4" filter="url(#orbGlow)" />
  <circle cx="600" cy="210" r="140" fill="#9333ea" filter="url(#orbGlow)" opacity="0.25" />

  <!-- Grid Layer -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Data Connection Lines (Background Behind Cards & Foreground Text) -->
  <path class="flow-line" d="M 100 80 Q 300 240 600 120 T 1100 280" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.35" />
  <path class="flow-line" d="M 50 340 Q 400 180 800 320 T 1150 100" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.3" style="animation-direction: reverse;" />

  <!-- Department Workflow Badges / Cards (Sides) -->
  <!-- Left Side Floating Card -->
  <g class="card-float-1" transform="translate(60, 240)">
    <rect width="190" height="64" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="36" cy="32" r="14" fill="#3b82f6" fill-opacity="0.2" />
    <text x="36" y="37" font-size="16" text-anchor="middle" fill="#60a5fa">🏢</text>
    <text class="body-text" x="62" y="28" font-size="12" font-weight="700" fill="#f8fafc">HR &amp; Facilities</text>
    <text class="body-text" x="62" y="46" font-size="10" fill="#94a3b8">Onboarding • Assets</text>
  </g>

  <!-- Left Upper Accent Card -->
  <g class="card-float-2" transform="translate(70, 70)">
    <rect width="170" height="52" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="30" cy="26" r="12" fill="#6366f1" fill-opacity="0.2" />
    <text x="30" y="31" font-size="14" text-anchor="middle" fill="#a5b4fc">⚡</text>
    <text class="body-text" x="52" y="24" font-size="12" font-weight="700" fill="#f8fafc">ITSM / ITIL</text>
    <text class="body-text" x="52" y="40" font-size="10" fill="#94a3b8">Incident • Change</text>
  </g>

  <!-- Right Side Floating Card -->
  <g class="card-float-2" transform="translate(940, 90)">
    <rect width="190" height="64" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="36" cy="32" r="14" fill="#a855f7" fill-opacity="0.2" />
    <text x="36" y="37" font-size="16" text-anchor="middle" fill="#c084fc">🤖</text>
    <text class="body-text" x="62" y="28" font-size="12" font-weight="700" fill="#f8fafc">AI Orchestration</text>
    <text class="body-text" x="62" y="46" font-size="10" fill="#94a3b8">Copilot • Automation</text>
  </g>

  <!-- Right Lower Accent Card -->
  <g class="card-float-1" transform="translate(950, 260)">
    <rect width="180" height="54" rx="12" fill="url(#cardGrad)" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="30" cy="27" r="12" fill="#14b8a6" fill-opacity="0.2" />
    <text x="30" y="32" font-size="14" text-anchor="middle" fill="#2dd4bf">🌐</text>
    <text class="body-text" x="52" y="24" font-size="12" font-weight="700" fill="#f8fafc">Open-Source Core</text>
    <text class="body-text" x="52" y="41" font-size="10" fill="#94a3b8">Self-Hosted • CMDB</text>
  </g>

  <!-- Central Header Container (Foreground Clear Visibility) -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <!-- Top Pill -->
    <rect x="-140" y="-12" width="280" height="28" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-116" cy="2" r="4" fill="#10b981" />
    <text class="body-text" x="0" y="7" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="1.5">ENTERPRISE SERVICE MANAGEMENT</text>

    <!-- Main Title -->
    <text class="title-text" x="0" y="65" font-size="46" fill="url(#textGrad)" filter="url(#glow)">Awesome ESM</text>
    
    <!-- Subtitle -->
    <text class="title-text" x="0" y="105" font-size="20" font-weight="600" fill="#f1f5f9">
      Curated List of SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Tagline -->
    <text class="body-text" x="0" y="135" font-size="14" fill="#94a3b8">
      Cross-Department Workflows • ITIL Service Desks • Self-Hosted CMDB • AI Service Catalogs
    </text>

    <!-- Feature Pills in Center -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <g transform="translate(-190, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text class="body-text" x="0" y="4" font-size="11" font-weight="600" fill="#38bdf8">✨ ITIL 4 Aligned</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-60, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text class="body-text" x="0" y="4" font-size="11" font-weight="600" fill="#818cf8">🏢 Multi-Tenant</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(65, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text class="body-text" x="0" y="4" font-size="11" font-weight="600" fill="#c084fc">🤖 AI-Native</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(195, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text class="body-text" x="0" y="4" font-size="11" font-weight="600" fill="#34d399">🔓 100% Free/OSS</text>
      </g>
    </g>
  </g>
</svg>
